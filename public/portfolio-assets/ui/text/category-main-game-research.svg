<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="176" viewBox="0 0 1000 176" role="img" aria-labelledby="title">
  <title id="title">游戏拆解与研究</title>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5ffff"/><stop offset=".22" stop-color="#a7fff5"/><stop offset=".58" stop-color="#4fe7dd"/><stop offset=".82" stop-color="#1eb5bd"/><stop offset="1" stop-color="#0b7185"/>
    </linearGradient>
    <filter id="rough" x="-8%" y="-18%" width="120%" height="150%"><feTurbulence type="fractalNoise" baseFrequency=".45" numOctaves="1" seed="12" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale=".75"/></filter>
    <text id="glyph" x="500" y="97" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="94" font-weight="900" text-anchor="middle">游戏拆解与研究</text>
